<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">Xlat Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow" data-i18n="optionsSettings">Xlat settings</p>
        <h1 data-i18n="optionsHeading">Default translation preferences</h1>
        <p class="lede" data-i18n="optionsDescription">These defaults stay in Chrome storage and are used by the popup before each local translation command.</p>
      </header>
      <section class="panel">
        <label data-i18n="defaultTargetLanguage">Default target language <input id="targetLanguage" value="ko" list="languageSuggestions" /></label>
        <datalist id="languageSuggestions">
          <option value="ko">Korean</option>
          <option value="en">English</option>
          <option value="ja">Japanese</option>
          <option value="zh-Hans">Chinese Simplified</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </datalist>
        <label data-i18n="maxBlocksPerRun">Max blocks per run <input id="maxBlocks" type="number" min="1" max="500" value="80" /></label>
        <label class="check" data-i18n="translateViewportFirst"><input id="viewportOnly" type="checkbox" /> Translate visible viewport first</label>
        <hr />
        <label>UI Language
          <select id="uiLanguage">
            <option value="">Browser default</option>
            <option value="en">English</option>
            <option value="ko">한국어</option>
            <option value="ja">日本語</option>
            <option value="zh-Hans">中文 (简体)</option>
            <option value="es">Español</option>
            <option value="hi">हिन्दी</option>
            <option value="ar">العربية</option>
            <option value="pt">Português</option>
            <option value="bn">বাংলা</option>
            <option value="ru">Русский</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="id">Bahasa Indonesia</option>
            <option value="tr">Türkçe</option>
            <option value="vi">Tiếng Việt</option>
            <option value="th">ไทย</option>
            <option value="ms">Bahasa Melayu</option>
            <option value="nl">Nederlands</option>
            <option value="pl">Polski</option>
            <option value="uk">Українська</option>
            <option value="ro">Română</option>
            <option value="cs">Čeština</option>
            <option value="hu">Magyar</option>
            <option value="sv">Svenska</option>
            <option value="da">Dansk</option>
            <option value="no">Norsk</option>
            <option value="fi">Suomi</option>
          </select>
        </label>
      </section>
      <p id="saveState" class="save-state" aria-live="polite" data-i18n="ready">Ready.</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
