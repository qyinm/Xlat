<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Xlat</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="bar">
        <h1>Xlat</h1>
        <span class="pill">on-device</span>
      </header>

      <div class="lang-row">
        <select id="sourceLanguage" class="lang-select" autocomplete="off"></select>
        <span class="arrow">&rarr;</span>
        <select id="targetLanguage" class="lang-select" autocomplete="off"></select>
      </div>

      <div class="actions">
        <button id="translatePage" class="btn primary-action" type="button">Translate page</button>
        <button id="translateSelection" class="btn" type="button">Selection</button>
        <button id="clearTranslations" class="btn" type="button">Clear</button>
      </div>

      <footer class="status-bar" aria-live="polite">
        <span id="statusDot" class="dot" aria-hidden="true"></span>
        <span id="status">Ready.</span>
      </footer>

      <details class="advanced">
        <summary>Advanced</summary>
        <div class="advanced-body">
          <label class="cfield">Display mode
            <select id="displayMode">
              <option value="append-below-original">Original + below</option>
              <option value="replace-text" disabled>Replace (phase 2)</option>
            </select>
          </label>
          <label class="cfield">Max blocks
            <input id="maxBlocks" type="number" min="1" max="500" value="80" />
          </label>
          <label class="check"><input id="viewportOnly" type="checkbox" /> Viewport only</label>
        </div>
      </details>

      <details class="advanced">
        <summary>Log</summary>
        <pre id="output" aria-live="polite"></pre>
      </details>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
