<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Xlat Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">Xlat settings</p>
        <h1>Default translation preferences</h1>
        <p class="lede">These defaults stay in Chrome storage and are used by the popup before each local translation command.</p>
      </header>
      <section class="panel">
        <label>Default target language <input id="targetLanguage" value="ko" list="languageSuggestions" /></label>
        <datalist id="languageSuggestions">
          <option value="ko">Korean</option>
          <option value="en">English</option>
          <option value="ja">Japanese</option>
          <option value="zh-Hans">Chinese Simplified</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </datalist>
        <label>Max blocks per run <input id="maxBlocks" type="number" min="1" max="500" value="80" /></label>
        <label class="check"><input id="viewportOnly" type="checkbox" /> Translate visible viewport first</label>
      </section>
      <p id="saveState" class="save-state" aria-live="polite">Ready.</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
